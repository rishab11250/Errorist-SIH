[project]
name = "lmpc-backend"
version = "0.1.0"
description = "LMPC compliance checker backend"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "argon2-cffi>=23.1",
    "fastapi>=0.115",
    "numpy>=2.0,<3",
    "opencv-python-headless>=4.10,<5",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "reportlab>=4.2",
    "pillow>=9.0",
    "pyyaml>=6.0",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.20",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
